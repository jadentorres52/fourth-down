<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Fourth-down calculator</title>
<link rel="icon" href="data:,">
<!-- Libre Franklin: a Franklin Gothic revival, the face of newspaper sports pages. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* White page, black text, and three colors that each mean one call:
   green = go for it, yellow = field goal, red = punt. */
:root {
  --bg: #ffffff;
  --ink: #161616;
  --muted: #6b6b6b;
  --rule: #e6e6e6;
  --go: #1f8a47;
  --fg: #f2c014;
  --punt: #d6312f;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { background: var(--bg); scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Libre Franklin", "Franklin Gothic Medium", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
*, *::before, *::after { box-sizing: inherit; }
h1, h2, p, ul { margin: 0; padding: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.page { max-width: 440px; margin: 0 auto; padding: 28px 20px 40px; }
.title { font-size: 18px; font-weight: 800; }
.muted { color: var(--muted); }

/* Sliders */
.sliders { margin-top: 18px; }
.slider { padding: 12px 0 8px; border-top: 1px solid var(--rule); }
.slider:first-child { border-top: 0; }
.slider-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.slider-top label { color: var(--muted); }
.slider-top output { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
input[type="range"] { display: block; width: 100%; height: 28px; margin: 4px 0 0; accent-color: var(--ink); }

/* The one button style */
.btn {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 15px 18px;
  border: 0;
  border-radius: 10px;
  background: var(--ink);
  color: #ffffff;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
}
.btn:active { transform: scale(0.99); }

/* Result */
.call {
  margin-top: 14px;
  text-wrap: balance;
  padding: 36px 16px;
  border-radius: 14px;
  text-align: center;
  font-size: clamp(32px, 10vw, 50px);
  line-height: 1.05;
  font-weight: 800;
  text-transform: uppercase;
  animation: pop 0.4s cubic-bezier(0.2, 1.4, 0.4, 1) both;
}
.call:focus { outline: none; }
.call.go { background: var(--go); color: #ffffff; }
.call.fg { background: var(--fg); color: var(--ink); }
.call.punt { background: var(--punt); color: #ffffff; }
.call.toss { background: #3d3d3d; color: #ffffff; }
@keyframes pop {
  from { opacity: 0; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1); }
}
.close { margin-top: 10px; text-align: center; }
.odds { margin-top: 26px; }
.odds h2 { font-size: 15px; font-weight: 400; }
.odds ul { margin-top: 4px; list-style: none; }
.odds li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.odds li.best { font-weight: 600; }
.odds .pct { margin-left: auto; font-variant-numeric: tabular-nums; }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
.dot.go { background: var(--go); }
.dot.fg { background: var(--fg); }
.dot.punt { background: var(--punt); }

@media (prefers-reduced-motion: reduce) {
  .call { animation: none; }
}
</style>
</head>

const CONV_FEATURES = ["ydstogo", "yardline_capped", "goal_to_go", "posteam_spread"];

if (READY) {
  if (MODELS.wp.features.join() !== WP_FEATURES.join() || MODELS.conv.features.join() !== CONV_FEATURES.join()) {
    throw new Error("The exported models don't match this page's feature order. Re-run python fourth_down.py export.");
  }
  // XGBoost splits on 32-bit floats. Math.fround reproduces that, so every comparison lands on the
  // same side of a split as it does in Python.
  for (const name of ["wp", "conv", "punt"]) for (const tree of MODELS[name].trees) tree[1] = tree[1].map(Math.fround);
}

/**
 * Sum of an XGBoost model's trees for one input row. Each tree is four parallel arrays:
 * [split feature, split value, left child, right child]. A node with left child -1 is a leaf,
 * and its "split value" holds the leaf's output instead.
 */
function treeSum(model, row) {
  const x = row.map(Math.fround);
  let total = model.base;
  for (const [feature, value, left, right] of model.trees) {
    let i = 0;
    while (left[i] !== -1) i = x[feature[i]] < value[i] ? left[i] : right[i];
    total += value[i];
  }
  return total;
}

// The pregame point spread was an input during training. The calculator assumes evenly matched
// teams, which is a spread of 0.
const SPREAD = 0;

/**
 * Win probability for the team with the ball, from nflverse's published model (WP_FEATURES in Python).
 * Home field and the 2nd-half kickoff aren't calculator inputs, so this averages over both, exactly as
 * evaluate() does in Python. Receiving the 2nd-half kickoff only counts in the first half.
 */
function winProb({ yardline_100, ydstogo, down, score_differential, gsr, half, ours, theirs }) {
  const ratio = score_differential / Math.exp((-4 * (3600 - gsr)) / 3600);
  let total = 0;
  for (const home of [0, 1]) {
    for (const receive of [0, 1]) {
      const row = [half < gsr ? receive : 0, home, half, gsr, ratio, score_differential, down, ydstogo, yardline_100, ours, theirs];
      total += 0.25 * sigmoid(treeSum(MODELS.wp, row));
    }
  }
  return total;
}

/** Expected win probability of each option. Mirrors evaluate() in fourth_down.py. */
function evaluate(s) {
  const { play_seconds, td_points, fg_offset, smoothing: SMOOTHING, red_zone, fail_penalty, own_half_line, fg_bonus, fg_range_line, fg_ramp, inches_fail_share, toss_up } = MODELS.constants;
  const y = s.yardline_100;
  const inches = s.ydstogo === 0; // 4th-and-inches: the models only know whole yards, so it starts from 4th & 1
  const togo = Math.max(1, Math.min(s.ydstogo, y));
  const diff = s.score_differential;
  const ours = s.posteam_timeouts_remaining;
  const theirs = s.defteam_timeouts_remaining;

  // Game and half clocks from quarter + clock, then the clock after the play (never past halftime).
  const gsr = s.quarter_seconds_remaining + 900 * (4 - s.qtr);
  const half = s.quarter_seconds_remaining + (s.qtr % 2 === 1 ? 900 : 0);
  const halfAfter = Math.max(half - play_seconds, 0);
  const gsrAfter = gsr - (half - halfAfter);

  // Win probability of a first down for whichever team has the ball at `spot`. Tree models are
  // step functions, so this averages over the two yard lines on each side (the SMOOTHING weights
  // from Python); otherwise close calls can flip back and forth between neighboring yard lines.
  const firstDown = (spot, score, offenseIsUs) => {
    let total = 0;
    let weights = 0;
    for (const [offset, weight] of SMOOTHING) {
      const yl = clip(spot + offset, 1, 99);
      total += weight * winProb({
        yardline_100: yl, ydstogo: Math.min(10, yl), down: 1, score_differential: score, gsr: gsrAfter, half: halfAfter,
        ours: offenseIsUs ? ours : theirs, theirs: offenseIsUs ? theirs : ours, spread: offenseIsUs ? SPREAD : -SPREAD,
      });
      weights += weight;
    }
    return total / weights;
  };
  const ourFirstDown = (yl, score) => firstDown(yl, score, true);
  const theirFirstDown = (spot, ourScore) => 1 - firstDown(clip(spot, 1, 99), -ourScore, false); // flipped to our view

  // Go for it: a first down at the line to gain (a touchdown, then a kickoff, if it's goal to go),
  // or the opponent's ball at the line of scrimmage.
  const goal = togo >= y;
  // Field position only affects conversion inside the red zone, where the field compresses.
  const pBase = sigmoid(treeSum(MODELS.conv, [togo, Math.min(y, red_zone), goal ? 1 : 0, SPREAD]));
  // Inches is assumed to cut the chance of failing (INCHES_FAIL_SHARE in Python), a judgment call.
  const pConvert = inches ? 1 - (1 - pBase) * inches_fail_share : pBase;
  const wpConvert = goal ? theirFirstDown(MODELS.kickoff_start, diff + td_points) : ourFirstDown(Math.max(y - togo, 1), diff);
  const wpFail = theirFirstDown(100 - y, diff);
  const go = pConvert * wpConvert + (1 - pConvert) * wpFail;
  // The conservative lean (FAIL_PENALTY in Python): early in a game, failing in your own half counts
  // extra against going for it. Nothing at your own 45, the most at your own 1, gone by the 4th quarter.
  const depth = clip((y - own_half_line) / (99 - own_half_line), 0, 1);
  const early = clip((gsr - 900) / 900, 0, 1);
  const goCall = pConvert * wpConvert + (1 - pConvert) * (wpFail - fail_penalty * depth * early);

  // Field goal: up 3 and kicking off, or the opponent's ball at the spot of the kick (their 20 at worst).
  const kickDistance = y + fg_offset;
  const raw = sigmoid(MODELS.fg.intercept + MODELS.fg.coef[0] * kickDistance + MODELS.fg.coef[1] * 0); // 0 = outdoors
  const pMake = kickDistance > MODELS.fg.max ? Math.min(raw, 0.01) : raw;
  const wpMake = theirFirstDown(MODELS.kickoff_start, diff + 3);
  const kickSpot = y + fg_offset - 10;
  const wpMiss = theirFirstDown(Math.min(100 - kickSpot, 80), diff);
  const fg = pMake * wpMake + (1 - pMake) * wpMiss;

  // Punt: the opponent starts wherever punts from here usually leave them (smoothed the same way).
  let landing = 0;
  let landingWeights = 0;
  for (const [offset, weight] of SMOOTHING) {
    landing += weight * treeSum(MODELS.punt, [clip(y + offset, 1, 99)]);
    landingWeights += weight;
  }
  const punt = theirFirstDown(clip(landing / landingWeights, 1, 99), diff);

  // Early in a game, take the points (FG_BONUS in Python): for kicks of 59 yards or shorter the field
  // goal gets a bonus, scaled by the chance it's good. Phases in from the opponent's 44; same early fade.
  const fgBonus = fg_bonus * pMake * clip((fg_range_line - y) / fg_ramp, 0, 1) * early * (goal && y <= 3 ? 0 : 1); // none on 4th & goal from the 3 in
  const fgCall = fg + fgBonus;

  // The call uses both leans; the win probabilities shown stay honest.
  const ranked = [["go", goCall], ["fg", fgCall], ["punt", punt]].sort((a, b) => b[1] - a[1]);
  const rawBest = [["go", go], ["fg", fg], ["punt", punt]].sort((a, b) => b[1] - a[1])[0][0];
  const best = ranked[0][0];
  const lean = best === rawBest ? null : best === "fg" ? "points" : "risk"; // which lean changed the call
  const margin = ranked[0][1] - ranked[1][1];
  // Within TOSS_UP it's a toss-up, unless a lean is in play (before the 4th quarter, own half or field goal range).
  const leanActive = fail_penalty * depth * early > 0 || fgBonus > 0;
  const tossUp = margin < toss_up && !leanActive;
  return { go, fg, punt, best, rawBest, lean, margin, tossUp, top: [best, ranked[1][0]] };
}

window.fourthDown = { evaluate }; // handy from the browser console, and used by the tests

// ---------------------------------------------------------------------------------------------
// Labels
// ---------------------------------------------------------------------------------------------

const CHOICES = ["go", "fg", "punt"];
const NAME = { go: "Go for it", fg: "Field goal", punt: "Punt" };
const CALL = { go: "Go for it", fg: "Kick the field goal", punt: "Punt" }; // shown in capitals by CSS
const ORDINAL = ["1st", "2nd", "3rd", "4th"];

const pct = (x) => `${(x * 100).toFixed(1)}%`;
const clock = (sec) => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
const isGoal = (s) => s.ydstogo >= s.yardline_100;
const scoreText = (d) => (d === 0 ? "Tied" : d > 0 ? `Up ${d}` : `Down ${-d}`);
// yardline_100 is yards from the opponent's end zone: 99 is your own 1, 1 is their 1.
const spotShort = (yl) => (yl === 50 ? "Midfield" : yl > 50 ? `Own ${100 - yl}` : `Opp ${yl}`);
const spotLong = (yl) => (yl === 50 ? "midfield" : yl > 50 ? `your own ${100 - yl}` : `the opponent’s ${yl}`);
const distanceText = (s) => (isGoal(s) ? "goal" : s.ydstogo === 0 ? "inches" : String(s.ydstogo));
const situationText = (s) =>
  `4th & ${distanceText(s)} at ${spotLong(s.yardline_100)}. ${scoreText(s.score_differential)}, ${clock(s.quarter_seconds_remaining)} left in the ${ORDINAL[s.qtr - 1]}.`;

// ---------------------------------------------------------------------------------------------
// Screens
// ---------------------------------------------------------------------------------------------

const START = {
  yardline_100: 42, ydstogo: 3, score_differential: -4, qtr: 4, quarter_seconds_remaining: 120,
  posteam_timeouts_remaining: 2, defteam_timeouts_remaining: 3,
};

function App() {
  const [situation, setSituation] = useState(START);
  const [result, setResult] = useState(null); // { situation, evaluation } after Calculate

  useEffect(() => { window.scrollTo(0, 0); }, [result]);

  if (!READY) {
    return html`<p className="page">This page doesn’t have trained models in it yet. Run <code>python fourth_down.py train</code> next to it.</p>`;
  }
  if (result) {
    return html`<${Result} result=${result} onBack=${() => setResult(null)} />`;
  }

  // You can't need more yards than there are to the end zone: that's 4th-and-goal.
  const change = (patch) => setSituation((prev) => {
    const next = { ...prev, ...patch };
    return { ...next, ydstogo: Math.min(next.ydstogo, next.yardline_100) };
  });
  return html`<${Sliders} s=${situation} change=${change}
    onCalculate=${() => setResult({ situation, evaluation: evaluate(situation) })} />`;
}

function Sliders({ s, change, onCalculate }) {
  return html`
    <main className="page">
      <h1 className="title">Fourth-down calculator</h1>
      <p className="muted">Set the situation, then calculate the best call.</p>
      <div className="sliders">
        <${Slider} label="Field position" value=${100 - s.yardline_100} min=${1} max=${99}
          text=${spotShort(s.yardline_100)} onChange=${(v) => change({ yardline_100: 100 - v })} />
        <${Slider} label="Yards to go" value=${s.ydstogo} min=${0} max=${Math.min(20, s.yardline_100)}
          text=${isGoal(s) ? "Goal" : s.ydstogo === 0 ? "Inches" : String(s.ydstogo)} onChange=${(v) => change({ ydstogo: v })} />
        <${Slider} label="Score" value=${s.score_differential} min=${-28} max=${28}
          text=${scoreText(s.score_differential)} onChange=${(v) => change({ score_differential: v })} />
        <${Slider} label="Quarter" value=${s.qtr} min=${1} max=${4}
          text=${ORDINAL[s.qtr - 1]} onChange=${(v) => change({ qtr: v })} />
        <${Slider} label="Time left in the quarter" value=${s.quarter_seconds_remaining} min=${0} max=${900} step=${5}
          text=${clock(s.quarter_seconds_remaining)} onChange=${(v) => change({ quarter_seconds_remaining: v })} />
        <${Slider} label="Your timeouts" value=${s.posteam_timeouts_remaining} min=${0} max=${3}
          text=${String(s.posteam_timeouts_remaining)} onChange=${(v) => change({ posteam_timeouts_remaining: v })} />
        <${Slider} label="Their timeouts" value=${s.defteam_timeouts_remaining} min=${0} max=${3}
          text=${String(s.defteam_timeouts_remaining)} onChange=${(v) => change({ defteam_timeouts_remaining: v })} />
      </div>
      <button type="button" className="btn" onClick=${onCalculate}>Calculate</button>
    </main>`;
}

function Slider({ label, value, min, max, step = 1, text, onChange }) {
  const id = useId();
  return html`
    <div className="slider">
      <div className="slider-top">
        <label htmlFor=${id}>${label}</label>
        <output htmlFor=${id}>${text}</output>
      </div>
      <input id=${id} type="range" min=${min} max=${max} step=${step} value=${value} disabled=${min === max}
        onChange=${(e) => onChange(Number(e.target.value))} />
    </div>`;
}

function Result({ result, onBack }) {
  const { situation: s, evaluation: e } = result;
  const callRef = useRef(null);
  useEffect(() => { callRef.current.focus(); }, []); // screen readers announce the call first

  return html`
    <main className="page">
      <p className="muted">${situationText(s)}</p>
      <h1 ref=${callRef} tabIndex=${-1} className=${`call ${e.tossUp ? "toss" : e.best}`}>${e.tossUp ? "Toss-up" : CALL[e.best]}</h1>
      ${e.tossUp && html`<p className="close muted">${NAME[e.top[0]]} and ${NAME[e.top[1]].toLowerCase()} are within 1 percentage point. Either is defensible.</p>`}
      ${e.tossUp ? null : e.lean === "risk"
        ? html`<p className="close muted">Going for it has a slightly higher raw chance of winning, but this calculator penalizes failing deep in your own half this early in a game.</p>`
        : e.lean === "points"
        ? html`<p className="close muted">${NAME[e.rawBest]} has a slightly higher raw chance of winning, but this calculator favors taking the points this early in a game.</p>`
        : e.margin < 0.02 && html`<p className="close muted">Close call: the top two options are within 2 percentage points, closer than these models can reliably separate.</p>`}
      <section className="odds">
        <h2 className="muted">Chance of winning</h2>
        <ul>
          ${CHOICES.map((c) => html`
            <li key=${c} className=${(e.tossUp ? e.top.includes(c) : c === e.best) ? "best" : undefined}>
              <span className=${`dot ${c}`} aria-hidden="true"></span>
              <span>${NAME[c]}</span>
              <span className="pct">${pct(e[c])}</span>
            </li>`)}
        </ul>
      </section>
      ${s.ydstogo === 0 && html`<p className="close muted">NFL play-by-play records 4th-and-inches as 4th & 1, so this assumes a third fewer failed attempts than a full yard. That’s just intuition.</p>`}
      <button type="button" className="btn" onClick=${onBack}>Change the situation</button>
    </main>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
